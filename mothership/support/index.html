<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Support Control Center | YourFavAlien</title><link rel="icon" href="/assets/favicon.png"><style>
:root{--bg:#080b10;--panel:#10151d;--panel2:#151c26;--line:#283341;--ink:#f6f8fb;--muted:#9ba8b7;--accent:#3182f6;--danger:#ef6b73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 Arial,sans-serif}.admin-shell{min-height:100vh}.admin-head{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line);background:rgba(8,11,16,.94);backdrop-filter:blur(16px)}.admin-brand{display:flex;align-items:center;gap:12px;font-weight:800}.admin-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff}.admin-head a{color:var(--ink);text-decoration:none}.admin-layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 71px)}.admin-side{padding:28px 18px;border-right:1px solid var(--line);background:#0b1017}.control-directory{display:grid;gap:8px;position:sticky;top:100px}.control-link{display:flex;min-height:58px;flex-direction:column;justify-content:center;padding:11px 13px;border:1px solid transparent;border-radius:10px;color:var(--ink);text-decoration:none;font-size:12px}.control-link span{color:#72aaf8;font-size:9px;letter-spacing:.12em}.control-link:hover{border-color:var(--line);background:var(--panel)}.admin-main{padding:38px clamp(20px,4vw,64px) 80px}.eyebrow{color:#72aaf8;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.section-head{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:24px}.section-head h2{margin:5px 0 0;font-size:clamp(30px,4vw,48px)}.section-copy{max-width:650px;color:var(--muted)}.divider{display:none}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:white;text-decoration:none;font-weight:700;cursor:pointer}.btn.secondary{background:transparent;color:var(--ink);border-color:va
