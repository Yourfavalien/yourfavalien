<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Mothership — YourFavAlien</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#070408;--panel:#120a11;--ink:#f3eeee;--muted:#a89ca5;--magenta:#b5175e;--line:rgba(255,255,255,.13)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 18% 12%,#2a1123 0,transparent 40%),var(--bg);color:var(--ink);font-family:'Space Mono',monospace}
    body{min-height:100vh;padding:24px;display:grid;place-items:center}
    main{width:min(720px,100%);padding:clamp(30px,7vw,68px);border:1px solid var(--line);border-radius:28px;background:rgba(18,10,17,.9);box-shadow:0 30px 100px rgba(0,0,0,.48);backdrop-filter:blur(16px)}
    .eyebrow{margin:0 0 18px;color:#d38cad;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-family:'Major Mono Display',monospace;font-size:clamp(42px,10vw,86px);font-weight:400;letter-spacing:.05em;line-height:.95}
    .copy{max-width:560px;margin:25px 0 0;color:var(--muted);font-size:14px;line-height:1.8}
    .admin-note{display:flex;gap:10px;align-items:center;margin-top:24px;color:#d8ced5;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .admin-note::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--magenta);box-shadow:0 0 18px rgba(181,23,94,.9)}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:13px 20px;border:0;border-radius:999px;background:var(--magenta);color:#fff;font-weight:700;text-decoration:none;transition:.18s}
    .button:hover,.button:focus-visible{transform:translateY(-1px);filter:brightness(1.1)}
    .public-link{display:inline-flex;align-items:center;padding:13px 8px;color:var(--muted);font-size:11px;text-decoration:none}
    .public-link:hover,.public-link:focus-visible{color:var(--ink)}
    footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:#786d75;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">YourFavAlien private control room</p>
    <h1>Mothership</h1>
    <p class="copy">Welcome to mission control. Website settings, live content, and private administration are available to the authorized administrator only.</p>
    <div class="admin-note">Admin only</div>
    <div class="actions">
      <a class="button" href="/mothership/admin.html">Admin Login&nbsp; ↗</a>
      <a class="public-link" href="/">Return to website</a>
    </div>
    <footer>Protected by Cloudflare Access</footer>
  </main>
</body>
</html>
