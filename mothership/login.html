<script>(()=>{const projectId='P3Kto1HcQtuOP8lNxNqJsi8hAwv2',flowId='mothership-sign-in',sdk=typeof window.Descope==='function'?window.Descope({projectId,persistTokens:true,autoRefresh:true}):null,status=document.getElementById('status'),flow=document.getElementById('flow'),next=new URLSearchParams(location.search).get('next');function message(text){status.textContent=text;status.hidden=!text}function render(){const component=document.createElement('descope-wc');component.setAttribute('project-id',projectId);component.setAttribute('flow-id',flowId);component.addEventListener('success',async event=>{try{message('Verifying access…');await sdk?.refresh({skipIfNoSession:true}).catch(()=>{});const token=event?.detail?.sessionToken||event?.detail?.sessionJwt||sdk?.getSessionToken?.();if(!token)throw new Error('Your sign-in session was unavailable. Please try again.');const response=await fetch('/mothership/passkey/session',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{Authorization:`Bearer ${token}`}});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'This account is not authorized for a private control center.');const requested=next==='/mothership/support/index.html'?'support':'mothership',permissions=payload.permissions||{};const destination=permissions[requested]?(requested==='support'?'/mothership/support/index.html':'/mothership/admin.html'):permissions.mothership?'/mothership/admin.html':permissions.support?'/mothership/support/index.html':null;if(!destination)throw new Error('This account has no private control center access.');location.replace(destination)}catch(error){message(error.message||'Could not complete sign-in.')}});flow.replaceChildren(component)}if(!window.customElements){message('This browser cannot load secure sign-in.');return}window.setTimeout(()=>{if(!flow.querySelector('descope-wc'))message('Secure sign-in could not load. Refresh and try again.')},15000);customElements.whenDefined('descope-wc').then(render).catch(()=>message('Secure sign-in could not load. Refresh and try again.'))})();</script></body></html>
