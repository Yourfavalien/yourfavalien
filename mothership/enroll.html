<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><title>Enroll passkey — Mothership</title>
  <script src="https://descopecdn.com/npm/@descope/web-component@4.4.12/dist/index.js" integrity="sha384-QzgrXVRMqjAqzKMX6Rrl7DgYzE30UzonBqKco0AzSDXwDiKS9RMDTKd5RZu9Ot1a" crossorigin="anonymous"></script>
  <script src="https://descopecdn.com/npm/@descope/web-js-sdk@1.54.4/dist/index.umd.js" integrity="sha384-Mzy5HRAhIVMW+iTgiIdeYT5AlFGOi7FTmIp/izytT+gl4/NhJCq9g6YuqGhnyDfO" crossorigin="anonymous"></script>
  <style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#070408;color:#f3eeee;font:14px/1.6 ui-monospace,monospace}main{width:min(520px,100%);padding:32px;border:1px solid #4a2c43;border-radius:24px;background:#120a11;box-shadow:0 28px 90px #0008}h1{letter-spacing:.08em;margin:.3rem 0}p,#status{color:#cbbbc4}.tag{color:#e8a6c4;font-size:11px;letter-spacing:.16em}descope-wc{display:block;margin-top:18px}.error{color:#ff9aaa!important}</style>
</head><body><main><div class="tag">INVITATION-ONLY SETUP</div><h1>ENROLL PASSKEY</h1><p>This one-time invitation adds a passkey to your approved Mothership account. You do not need to sign in first.</p><div id="status" role="status" aria-live="polite">Loading secure enrollment…</div><div id="flow"></div></main>
<script>(()=>{const projectId='P3Kto1HcQtuOP8lNxNqJsi8hAwv2',flowId='mothership-enroll',status=document.getElementById('status'),flow=document.getElementById('flow');function message(text,error=false){status.textContent=text;status.className=error?'error':''}function render(){message('Create a passkey with this device.');flow.innerHTML=`<descope-wc project-id="${projectId}" flow-id="${flowId}"></descope-wc>`;const component=flow.querySelector('descope-wc');component.addEventListener('success',async event=>{try{message('Verifying your approved Mothership access…');const token=event?.detail?.sessionJwt;if(!token)throw new Error('The passkey did not return a session. Try again.');const response=await fetch('/mothership/passkey/session',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{Authorization:`Bearer ${token}`}});if(!response.ok){const payload=await response.json().catch(()=>({}));throw new Error(payload.error||'This invitation is not authorized for Mothership.')}location.replace('/mothership/admin.html')}catch(error){message(error.message||'Could not complete enrollment.',true)}});component.addEventListener('error',()=>message('Passkey enrollment was not completed. Try again.',true))}if(!window.customElements){message('This browser cannot use passkeys.',true);return}customElements.whenDefined('descope-wc').then(render).catch(()=>message('Secure passkey enrollment could not load. Refresh and try again.',true))})();</script></body></html>
