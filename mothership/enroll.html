<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><title>Enroll passkey — Mothership</title>
  <script src="https://descopecdn.com/npm/@descope/web-component@4.4.12/dist/index.js" integrity="sha384-QzgrXVRMqjAqzKMX6Rrl7DgYzE30UzonBqKco0AzSDXwDiKS9RMDTKd5RZu9Ot1a" crossorigin="anonymous"></script>
  <script src="https://descopecdn.com/npm/@descope/web-js-sdk@1.54.4/dist/index.umd.js" integrity="sha384-Mzy5HRAhIVMW+iTgiIdeYT5AlFGOi7FTmIp/izytT+gl4/NhJCq9g6YuqGhnyDfO" crossorigin="anonymous"></script>
  <style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#070408;color:#f3eeee;font:14px/1.6 ui-monospace,monospace}main{width:min(520px,100%);padding:32px;border:1px solid #4a2c43;border-radius:24px;background:#120a11;box-shadow:0 28px 90px #0008}h1{letter-spacing:.08em;margin:.3rem 0}p,#status{color:#cbbbc4}.tag{color:#e8a6c4;font-size:11px;letter-spacing:.16em}descope-wc{display:block;margin-top:18px}.error{color:#ff9aaa!important}#status{white-space:pre-wrap;overflow-wrap:anywhere}</style>
</head><body><main><div class="tag">INVITATION-ONLY SETUP</div><h1>ENROLL PASSKEY</h1><p>Verify your approved Mothership account, then register a passkey for secure access.</p><div id="status" role="status" aria-live="polite">Loading secure enrollment…</div><div id="flow"></div></main>
<script>
(() => {
  const projectId = 'P3Kto1HcQtuOP8lNxNqJsi8hAwv2';
  const flowId = 'mothership-enroll';
  const status = document.getElementById('status');
  const flow = document.getElementById('flow');
  const sdk = typeof window.Descope === 'function'
    ? window.Descope({ projectId, persistTokens: true, autoRefresh: true })
    : null;

  function message(text, error = false) {
    status.textContent = text;
    status.className = error ? 'error' : '';
  }

  function displayError(detail) {
    const reason = detail?.errorMessage || detail?.errorDescription ||
      detail?.message || detail?.error?.errorMessage ||
      detail?.error?.errorDescription || detail?.error?.message;
    const code = detail?.errorCode || detail?.error?.errorCode || detail?.code;
    const safeReason = typeof reason === 'string' && reason.trim()
      ? reason.trim().slice(0, 350)
      : 'The enrollment flow failed without returning a detailed message.';
    const safeCode = typeof code === 'string' && /^[a-z0-9_-]{1,24}$/i.test(code)
      ? ' (' + code + ')' : '';
    return 'Descope error' + safeCode + ': ' + safeReason;
  }

  function render() {
    message('Connecting to secure enrollment…');
    // Register listeners BEFORE connecting the component to the page so
    // startup errors cannot occur before the error listener exists.
    const component = document.createElement('descope-wc');
    component.setAttribute('project-id', projectId);
    component.setAttribute('flow-id', flowId);
    let ready = false;
    let failed = false;
    component.addEventListener('ready', () => {
      ready = true;
      message('Verify your approved account, then register your passkey.');
    });
    component.addEventListener('error', event => {
      failed = true;
      message(displayError(event?.detail), true);
    });
    component.addEventListener('success', async event => {
      try {
        message('Verifying your approved Mothership access…');
        await sdk?.refresh({ skipIfNoSession: true }).catch(() => {});
        const token = event?.detail?.sessionToken || event?.detail?.sessionJwt ||
          sdk?.getSessionToken?.();
        if (!token) throw new Error('The passkey was approved, but its sign-in session was unavailable. Try once more.');
        const response = await fetch('/mothership/passkey/session', {
          method: 'POST', credentials: 'same-origin', cache: 'no-store',
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.error || 'This invitation is not authorized for Mothership.');
        }
        location.replace('/mothership/admin.html');
      } catch (error) {
        message(error.message || 'Could not complete enrollment.', true);
      }
    });
    flow.replaceChildren(component);
    window.setTimeout(() => {
      if (failed) return;
      if (!ready) {
        message('Descope has not finished loading the enrollment form. No detailed error was returned. Refresh this page, then check again.', true);
      } else if (component.getBoundingClientRect().height < 20) {
        message('Descope reported that it was ready, but the enrollment form is still blank. Refresh the page and try again.', true);
      }
    }, 20000);
  }

  if (!window.customElements) {
    message('This browser cannot load the secure passkey component.', true);
    return;
  }
  let registered = false;
  window.setTimeout(() => {
    if (!registered) message('The Descope sign-in component did not load. Refresh the page and try again.', true);
  }, 15000);
  customElements.whenDefined('descope-wc')
    .then(() => { registered = true; render(); })
    .catch(() => message('Secure passkey enrollment could not load. Refresh and try again.', true));
})();
</script></body></html>
