<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>contact — YourFavAlien</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0a0507; --dark: #12080d; --magenta: #b5175e;
      --magenta-dark: #8b1148; --cyan: #4de8d8; --yellow: #f5c518;
      --white: #f0ece8; --gray-light: #e8e4e0; --nav-border: rgba(255,255,255,0.6);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Space Mono', monospace; background: var(--black); color: var(--white); overflow-x: hidden; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: center; gap: 12px; padding: 18px 20px;
    }
    nav a {
      text-decoration: none; color: var(--white); font-family: 'Courier Prime', monospace;
      font-size: 13px; letter-spacing: 0.02em; border: 1.5px solid var(--nav-border);
      border-radius: 999px; padding: 6px 18px; transition: background 0.2s, color 0.2s; white-space: nowrap;
    }
    nav a:hover, nav a.active { background: rgba(255,255,255,0.15); }
    .tri {
      display: inline-block; width: 0; height: 0;
      border-left: 0.35em solid transparent; border-right: 0.35em solid transparent;
      border-bottom: 0.55em solid var(--white); margin: 0 1px;
      vertical-align: middle; position: relative; top: -0.15em;
    }
    .stars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .star { position: absolute; width: 3px; height: 3px; background: rgba(255,255,255,0.6); border-radius: 50%; animation: twinkle 3s infinite alternate; }
    @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 0.9; transform: scale(1.2); } }
    footer { background: #050205; color: rgba(255,255,255,0.3); text-align: center; padding: 28px 20px; font-family: 'Courier Prime', monospace; font-size: 11px; letter-spacing: 0.1em; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--magenta); border-radius: 2px; } }


    body { background: var(--black); }
    .contact-page { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 100px 8%; position: relative; overflow: hidden; }
    .contact-inner { position: relative; z-index: 2; max-width: 580px; }
    .contact-inner h2 { font-family: 'Playfair Display',serif; font-size: clamp(36px,6vw,72px); font-weight: 400; font-style: italic; line-height: 1.1; margin-bottom: 30px; }
    .contact-body { font-family: 'Courier Prime',monospace; font-size: 13px; line-height: 1.9; color: rgba(255,255,255,0.75); margin-bottom: 28px; max-width: 420px; }
    .contact-btn { display: inline-block; font-family: 'Courier Prime',monospace; font-size: 13px; color: var(--white); border: 1.5px solid rgba(255,255,255,0.5); border-radius: 999px; padding: 9px 24px; text-decoration: none; cursor: pointer; background: transparent; transition: background 0.2s; letter-spacing: 0.05em; }
    .contact-btn:hover { background: rgba(255,255,255,0.1); }
    .contact-art { position: absolute; right: -40px; bottom: 0; width: 60%; max-width: 700px; opacity: 0.9; pointer-events: none; }
    @media (max-width:600px) { .contact-art { width:100%; right:-20px; opacity:0.4; } }


    /* ── GLOBAL RESPONSIVE ── */
    html { box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }
    img, video, iframe { max-width: 100%; }

    /* NAV — mobile wrap */
    @media (max-width: 480px) {
      nav {
        gap: 5px;
        padding: 12px 8px;
        flex-wrap: wrap;
        justify-content: center;
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(8px);
      }
      nav a { font-size: 9px; padding: 5px 9px; }
    }

    /* HERO — full height on all screens */
    @media (max-width: 768px) {
      .hero-photo { height: 55vh; }
    }
    @media (max-width: 480px) {
      .hero-photo { height: 50vh; }
      .hero-handle h1 { font-size: 20px !important; }
      .hero-handle p { font-size: 10px; }
    }

    /* HERO HOME section */
    @media (max-width: 768px) {
      .hero-logo { gap: 20px !important; }
      .hero-logo span { font-size: clamp(18px, 7vw, 40px) !important; }
    }

    /* ABOUT page */
    @media (max-width: 768px) {
      .about-header { padding-top: 80px; }
      .about-text { padding: 30px 6%; font-size: 13px; }
    }
    @media (max-width: 480px) {
      .about-header h2 { font-size: 24px; letter-spacing: 0.2em; }
      .about-text { font-size: 12px; line-height: 1.8; }
    }

    /* CONTACT page */
    @media (max-width: 768px) {
      .contact-page { padding: 90px 6% 40px; }
      .contact-inner h2 { font-size: clamp(28px, 8vw, 52px); }
      .contact-art { width: 100%; right: -10px; opacity: 0.3; bottom: 0; }
    }
    @media (max-width: 480px) {
      .contact-art { display: none; }
      .contact-body { font-size: 12px; }
    }

    /* SUBSCRIBE page */
    @media (max-width: 768px) {
      .subscribe-card { padding: 30px 20px; margin-top: 60px; }
      .subscribe-logo-top { top: 80px; gap: 20px; }
      .subscribe-logo-top span { font-size: clamp(16px, 4vw, 28px); }
    }
    @media (max-width: 480px) {
      .subscribe-card { width: 95%; }
      .subscribe-card h3 { font-size: 14px; }
      .subscribe-logo-top { display: none; }
    }

    /* SOCIALS page */
    @media (max-width: 768px) {
      .links-inner { max-width: 100%; }
      .social-card { border-radius: 12px; }
      .social-link, .social-pill { font-size: 13px; padding: 14px 18px; }
      .card-thumbs { height: 90px; }
    }
    @media (max-width: 480px) {
      .links-section { padding: 16px 12px 50px; }
      .social-pill { padding: 13px 16px; font-size: 12px; }
      .card-info { padding: 10px 12px; }
      .card-name { font-size: 12px; }
      .card-sub { font-size: 9px; }
      .card-platform-icon { width: 30px; height: 30px; font-size: 14px; }
      .subscribe-card { padding: 20px 16px; }
      .subscribe-card h3 { font-size: 13px; }
      .subscribe-card p { font-size: 10px; }
      .subscribe-btn { font-size: 12px; padding: 12px; }
    }

    /* TikTok embed scroll row */
    @media (max-width: 480px) {
      .social-card div[style*="overflow-x"] > div {
        width: 130px !important;
        height: 230px !important;
      }
    }

    /* Touch-friendly tap targets */
    @media (hover: none) {
      .social-link:hover, .social-pill:hover,
      .social-card:hover, .join-btn:hover,
      .contact-btn:hover { transform: none; filter: none; }
      .social-link:active, .social-pill:active { opacity: 0.85; }
    }

  </style>
</head>
<body>
  <nav>
    <a href="index.html">home</a>
    <a href="socials.html">socials</a>
    <a href="about.html">about moi</a>
    <a href="contact.html" class="active">contact</a>
    <a href="subscribe.html">subscribe</a>
  </nav>

  <div class="contact-page">
    <div class="stars" id="contact-stars"></div>
    <img src="assets/contact-1.webp" alt="Glasses art" class="contact-art" style="mix-blend-mode:multiply;" />
    <div class="contact-inner">
      <h2>let's connect</h2>
      <p class="contact-body">I'm excited to collaborate with you! Whether you have questions or want to explore the range of services I offer, feel free to reach out. Let's create something amazing together!</p>
      <a class="contact-btn" href="https://tally.so/r/NpxlQB" target="_blank" rel="noopener noreferrer">contact</a>
    </div>
  </div>
  <footer>© 2026 YourFavAlien · All rights reserved</footer>
  <script>

    function makeStars(containerId, count) {
      const container = document.getElementById(containerId);
      if (!container) return;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = (Math.random() * 3) + 's';
        star.style.animationDuration = (2 + Math.random() * 3) + 's';
        star.style.opacity = Math.random() * 0.7 + 0.1;
        container.appendChild(star);
      }
    }

makeStars('contact-stars', 22);
  </script>
</body>
</html>
