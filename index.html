<script>

    function makeStars(containerId, count) {
      const container = document.getElementById(containerId);
      if (!container) return;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = (Math.random() * 3) + 's';
        star.style.animationDuration = (2 + Math.random() * 3) + 's';
        star.style.opacity = Math.random() * 0.7 + 0.1;
        container.appendChild(star);
      }
    }


    makeStars('hero-stars', 18);

<script id="yfa-page-transitions">
(function () {
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  function isSameSitePageLink(anchor) {
    if (!anchor || !anchor.href) return false;
    const url = new URL(anchor.href, window.location.href);
    if (url.origin !== window.location.origin) return false;
    if (anchor.target && anchor.target !== '_self') return false;
    if (anchor.hasAttribute('download')) return false;
    if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return false;
    return true;
  }

  document.addEventListener('click', function (event) {
    if (event.defaultPrevented || event.button !== 0) return;
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const anchor = event.target.closest('a');
    if (!isSameSitePageLink(anchor)) return;
    event.preventDefault();
    document.body.classList.add('yfa-page-leaving');
    const destination = anchor.href;
    window.setTimeout(function () { window.location.href = destination; }, 210);
  });

  window.addEventListener('pageshow', function () {
    document.body.classList.remove('yfa-page-leaving');
  });
})();
</script>
